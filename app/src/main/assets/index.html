<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b5ce2">
<title>أبطال المعرفة</title>
<style>
:root{--primary:#5b5ce2;--secondary:#ffb84d;--ink:#26304b;--muted:#68738d;--paper:#fff;--bg:#f2f5ff;--good:#20a66a;--bad:#e05260}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#eef1ff,#fff7e9);color:var(--ink);min-height:100vh}
button,select{font:inherit}button{cursor:pointer;border:0}
.app{max-width:1000px;margin:auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 20px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,#6969ed,#9a7cf5);display:grid;place-items:center;color:white;font-size:30px;box-shadow:0 8px 20px #7775}
h1{font-size:clamp(23px,4vw,34px);margin:0}.subtitle{color:var(--muted);margin-top:5px;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:white;border-radius:14px;padding:10px 14px;box-shadow:0 4px 14px #28345c10;font-weight:bold}
.hero{background:linear-gradient(120deg,#5b5ce2,#8d70ed);border-radius:25px;padding:22px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:15px;overflow:hidden;box-shadow:0 12px 28px #6664}
.hero h2{margin:0 0 8px;font-size:25px}.hero p{margin:0;opacity:.92;line-height:1.7}.mascot{font-size:75px;animation:bob 2.4s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-9px) rotate(4deg)}}
.section-title{margin:25px 2px 12px;font-size:20px}
.levels{display:flex;gap:9px;flex-wrap:wrap}.level{background:white;border:2px solid transparent;border-radius:13px;padding:10px 15px;color:var(--ink);font-weight:bold}.level.active{border-color:var(--primary);background:#f0efff;color:var(--primary)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.game{background:white;border-radius:20px;padding:17px;text-align:right;box-shadow:0 6px 18px #28345c0d;transition:.2s;border:2px solid transparent;min-height:132px}.game:hover{transform:translateY(-3px);border-color:#d9d8ff}.game .emoji{font-size:34px}.game h3{margin:8px 0 5px}.game p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.primary{background:var(--secondary);color:#49320d;border-radius:14px;padding:13px 20px;font-weight:bold;box-shadow:0 5px 0 #df9630}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #df9630}
.secondary{background:#eeefff;color:var(--primary);border-radius:12px;padding:11px 15px;font-weight:bold}
.settings{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}.toggle{background:white;border-radius:13px;padding:10px 13px;display:flex;gap:8px;align-items:center;font-size:14px}
.panel{display:none;background:white;border-radius:24px;padding:clamp(16px,4vw,28px);margin-top:20px;box-shadow:0 8px 25px #28345c12}.panel.show{display:block}
.quiztop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.progress{height:10px;background:#edf0fa;border-radius:20px;overflow:hidden;margin:17px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#5b5ce2,#9a7cf5);transition:width .3s}
.question{text-align:center;padding:15px 0 20px}.question .qemoji{font-size:48px}.question h2{font-size:clamp(25px,5vw,38px);margin:10px 0}.speak{background:#eef0ff;color:#5558d8;border-radius:50%;width:42px;height:42px;font-size:20px;vertical-align:middle;margin-right:8px}.animalSound{display:none;background:#fff1d6;color:#805000;border:2px solid #ffd27a;border-radius:14px;padding:11px 18px;font-weight:bold;margin:10px auto 0}.animalSound.show{display:block}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{padding:16px 10px;border:2px solid #e8eaf5;border-radius:15px;background:#fafbff;font-size:20px;font-weight:bold;color:var(--ink);min-height:60px}.answer:hover{border-color:#a6a5f5;background:#f3f2ff}.answer.correct{background:#e5f8ee;border-color:var(--good);color:#147a4b}.answer.wrong{background:#fff0f0;border-color:var(--bad);color:#b52e3d}
.feedback{text-align:center;min-height:35px;font-weight:bold;margin:15px 0 5px}.quizactions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}
.result{text-align:center;padding:15px}.result .big{font-size:70px}.result h2{font-size:28px}.result p{color:var(--muted);line-height:1.8}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px 0 10px}
@media(max-width:560px){.app{padding:12px}.hero{padding:17px}.mascot{font-size:55px}.answers{grid-template-columns:1fr 1fr}.answer{font-size:17px;padding:13px 7px}.stats{width:100%}.stat{flex:1;text-align:center}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="logo">🏆</div><div><h1>أبطال المعرفة</h1><div class="subtitle">اتعلّم والعب واجمع النجوم!</div></div></div>
 <div class="stats"><div class="stat">⭐ نقاطك: <span id="totalScore">0</span></div><div class="stat">🏅 أفضل نتيجة: <span id="bestScore">0</span></div></div>
</header>
<section class="hero">
 <div><h2>أهلاً يا بطل! 👋</h2><p>اختار لعبتك ومستواك، وجاوب صح علشان تجمع أكبر عدد من النجوم.<br>جاهز للتحدي؟</p></div>
 <div class="mascot" aria-label="شخصية البطل">🦊</div>
</section>

<h2 class="section-title">🎯 اختار مستوى الصعوبة</h2>
<div class="levels" id="levels">
 <button class="level active" data-level="easy">🟢 سهل</button>
 <button class="level" data-level="medium">🟡 متوسط</button>
 <button class="level" data-level="hard">🔴 صعب</button>
</div>

<h2 class="section-title">🕹️ اختار القسم</h2>
<div class="games">
 <button class="game" data-game="math"><span class="emoji">✖️</span><h3>جدول الضرب</h3><p>اتدرّب على جداول الضرب من 1 إلى 12.</p></button>
 <button class="game" data-game="colors"><span class="emoji">🎨</span><h3>عالم الألوان</h3><p>اتعرّف على الألوان وأسمائها.</p></button>
 <button class="game" data-game="animals"><span class="emoji">🐯</span><h3>مملكة الحيوانات</h3><p>اعرف الحيوان وصوته ومعلومات بسيطة عنه.</p></button>
 <button class="game" data-game="shapes"><span class="emoji">🔷</span><h3>الأشكال الهندسية</h3><p>ميّز بين الأشكال المختلفة.</p></button>
 <button class="game" data-game="mix"><span class="emoji">🌟</span><h3>التحدي الشامل</h3><p>أسئلة متنوعة من كل الأقسام.</p></button>
</div>
<div class="settings">
 <label class="toggle"><input id="soundToggle" type="checkbox" checked> 🔊 صوت نطق الأسئلة</label>
 <label class="toggle"><input id="effectToggle" type="checkbox" checked> 🎉 مؤثرات الإجابة</label>
 <button class="secondary" id="resetBtn">إعادة ضبط النقاط</button>
</div>

<section class="panel" id="quiz">
 <div class="quiztop"><strong id="gameName">اللعبة</strong><strong>السؤال <span id="questionNo">1</span> من 10</strong></div>
 <div class="progress"><div class="bar" id="progressBar"></div></div>
 <div class="question"><div class="qemoji" id="qEmoji">❓</div><h2><span id="questionText">السؤال</span><button class="speak" id="speakBtn" title="اسمع السؤال">🔊</button></h2><button class="animalSound" id="animalSoundBtn">🐾 اسمع صوت الحيوان</button></div>
 <div class="answers" id="answers"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="quizactions"><button class="primary" id="nextBtn" disabled>السؤال التالي ←</button><button class="secondary" id="homeBtn">العودة للأقسام</button></div>
</section>
<section class="panel" id="result">
 <div class="result"><div class="big" id="resultEmoji">🏆</div><h2 id="resultTitle">أحسنت يا بطل!</h2><p id="resultText"></p><button class="primary" id="againBtn">العب مرة تانية 🔄</button> <button class="secondary" id="resultHomeBtn">الأقسام الرئيسية</button></div>
</section>
<footer>أبطال المعرفة — التعلّم أحلى باللعب 💜</footer>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let level='easy', currentGame='math', questions=[], index=0, score=0, answered=false, lastGame='math';
let total=Number(localStorage.getItem('abtal_total')||0), best=Number(localStorage.getItem('abtal_best')||0);
const names={math:'جدول الضرب',colors:'عالم الألوان',animals:'مملكة الحيوانات',shapes:'الأشكال الهندسية',mix:'التحدي الشامل'};
const animals=[
 ['🐱','القطة','مياو','cat-meow'],['🐶','الكلب','هوهو','dog-bark'],['🐄','البقرة','خوار','cow-moo'],['🐑','الخروف','مأمأ','sheep-bleat'],['🦁','الأسد','زئير','lion-roar'],['🐴','الحصان','صهيل','horse-neigh'],['🦆','البطة','بطبط','duck-quack'],['🐓','الديك','صياح','rooster-crow']
];
const animalAudio={
 'cat-meow':'https://sfxmint.com/dl/animal-cat-meow-34.mp3',
 'dog-bark':'https://sfxmint.com/dl/animal-dog-bark-25.mp3',
 'cow-moo':'https://sfxmint.com/dl/cow-moo-02.mp3',
 'sheep-bleat':'https://sfxmint.com/dl/sheep-bleat-02.mp3',
 'lion-roar':'https://sfxmint.com/dl/lion-roar-02.mp3',
 'horse-neigh':'https://sfxmint.com/dl/horse-neigh-03.mp3',
 'duck-quack':'https://sfxmint.com/dl/duck-quack-02.mp3',
 'rooster-crow':'https://sfxmint.com/dl/rooster-crow-02.mp3'
};
let animalPlayer=null;
const colors=[['🔴','أحمر'],['🔵','أزرق'],['🟢','أخضر'],['🟡','أصفر'],['🟣','بنفسجي'],['🟠','برتقالي'],['⚫','أسود'],['⚪','أبيض'],['🟤','بني'],['🩷','وردي']];
const shapes=[['🔺','مثلث'],['🟦','مربع'],['🔵','دائرة'],['▭','مستطيل'],['⭐','نجمة'],['❤️','قلب'],['⬡','سداسي'],['🥚','بيضاوي']];
const rand=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.sort(()=>Math.random()-.5);
function distractors(correct,pool,n=3){return shuffle([...new Set([correct,...shuffle(pool.filter(x=>x!==correct)).slice(0,n)])]).slice(0,4)}
function makeQuestion(text,emoji,correct,pool){return {text,emoji,correct,answers:distractors(correct,pool)}}
function buildMath(){
 let arr=[];let max=level==='easy'?5:level==='medium'?9:12;let min=level==='hard'?6:1;
 for(let i=0;i<10;i++){let a=Math.floor(Math.random()*(max-min+1))+min,b=Math.floor(Math.random()*(max-min+1))+min,c=a*b;let pool=Array.from({length:25},(_,j)=>Math.max(0,c+Math.floor(Math.random()*13)-6)).filter(x=>x!==c);arr.push(makeQuestion(`${a} × ${b} = ؟`,'✖️',String(c),pool.map(String)))}
 return arr;
}
function buildList(kind,data){
 return Array.from({length:10},()=>{
  let item=rand(data),ask=kind==='colors'?'ما اسم اللون ده؟':kind==='animals'?'ما اسم الحيوان ده؟':'ما اسم الشكل ده؟';
  if(kind==='animals'&&Math.random()>.5){ask=`ما صوت ${item[1]}؟`;let q=makeQuestion(ask,item[0],item[2],data.map(x=>x[2]));q.animalSound=item[3];q.animalName=item[1];return q}
  let q=makeQuestion(ask,item[0],item[1],data.map(x=>x[1]));if(kind==='animals'){q.animalSound=item[3];q.animalName=item[1]}return q;
 });
}
function start(game){
 currentGame=game;lastGame=game;index=0;score=0;answered=false;
 let make=()=>game==='math'?buildMath():game==='colors'?buildList('colors',colors):game==='animals'?buildList('animals',animals):game==='shapes'?buildList('shapes',shapes):shuffle([...buildMath().slice(0,3),...buildList('colors',colors).slice(0,2),...buildList('animals',animals).slice(0,3),...buildList('shapes',shapes).slice(0,2)]);
 questions=make();$('quiz').classList.add('show');$('result').classList.remove('show');$('quiz').scrollIntoView({behavior:'smooth',block:'start'});$('gameName').textContent=names[game];render();
}
function render(){
 const q=questions[index];answered=false;$('questionNo').textContent=index+1;$('progressBar').style.width=(index/10*100)+'%';$('qEmoji').textContent=q.emoji;$('questionText').textContent=q.text;$('feedback').textContent='';$('nextBtn').disabled=true;$('nextBtn').textContent=index===9?'اعرض النتيجة 🏆':'السؤال التالي ←';
 $('animalSoundBtn').classList.toggle('show',!!q.animalSound);$('answers').innerHTML='';q.answers.forEach(ans=>{let b=document.createElement('button');b.className='answer';b.textContent=ans;b.addEventListener('click',()=>choose(b,ans));$('answers').appendChild(b)});
 if($('soundToggle').checked)speak(q.text);
}
function choose(button,answer){
 if(answered)return;answered=true;let q=questions[index],correct=answer===q.correct;
 [...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===q.correct)b.classList.add('correct')});
 if(correct){score+=level==='easy'?10:level==='medium'?15:20;$('feedback').textContent='برافو عليك! إجابة صحيحة ⭐';$('feedback').style.color='var(--good)';if($('effectToggle').checked)beep(660)}
 else{button.classList.add('wrong');$('feedback').textContent=`مش مشكلة! الإجابة الصحيحة: ${q.correct}`;$('feedback').style.color='var(--bad)';if($('effectToggle').checked)beep(220)}
 $('nextBtn').disabled=false;
}
function next(){if(!answered)return;if(index<9){index++;render()}else finish()}
function finish(){
 total+=score;best=Math.max(best,score);localStorage.setItem('abtal_total',total);localStorage.setItem('abtal_best',best);updateStats();
 $('quiz').classList.remove('show');$('result').classList.add('show');$('progressBar').style.width='100%';
 $('resultEmoji').textContent=score>=120?'🥇':score>=70?'🏆':'💪';$('resultTitle').textContent=score>=120?'أسطورة المعرفة!':score>=70?'أحسنت يا بطل!':'بداية جميلة، حاول تاني!';
 $('resultText').textContent=`جمعت ${score} نقطة من أصل ${level==='easy'?100:level==='medium'?150:200} نقطة في ${names[currentGame]}. استمر في التدريب وهتوصل للأفضل!`;$('result').scrollIntoView({behavior:'smooth'});
}
function updateStats(){$('totalScore').textContent=total;$('bestScore').textContent=best}
function playAnimalSound(){let q=questions[index];if(!q?.animalSound)return;try{if(animalPlayer){animalPlayer.pause();animalPlayer.currentTime=0}animalPlayer=new Audio(animalAudio[q.animalSound]);animalPlayer.volume=.9;animalPlayer.play().catch(()=>speak(`صوت ${q.animalName} ${animals.find(a=>a[1]===q.animalName)?.[2]||''}`))}catch(e){speak(`صوت ${q.animalName}`)}}
function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ar-EG';u.rate=.85;window.speechSynthesis.speak(u)}
function beep(freq){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=freq;g.gain.value=.07;o.start();o.stop(c.currentTime+.12)}catch(e){}}
function home(){$('quiz').classList.remove('show');$('result').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.game').forEach(b=>b.addEventListener('click',()=>start(b.dataset.game)));
document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>{level=b.dataset.level;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active',x===b))}));
$('nextBtn').addEventListener('click',next);$('homeBtn').addEventListener('click',home);$('resultHomeBtn').addEventListener('click',home);$('againBtn').addEventListener('click',()=>start(lastGame));$('speakBtn').addEventListener('click',()=>speak(questions[index]?.text||''));$('animalSoundBtn').addEventListener('click',playAnimalSound);$('resetBtn').addEventListener('click',()=>{if(confirm('متأكد إنك عايز تصفر مجموع النقاط وأفضل نتيجة؟')){total=0;best=0;localStorage.removeItem('abtal_total');localStorage.removeItem('abtal_best');updateStats()}});
updateStats();
})();
</script>
</body>
</html>
